  /* ---------- مراجعة المراقبة والتحكم: تصنيف مفتوح / مغلق ---------- */
  loopSort:{
    html:s=>`${head(s)}<div class="s-body"><div class="review-grid">
      <div class="col">${conceptsHTML(s)}<div class="task st">${s.task}</div></div>
      <div class="st"><div class="sim" style="--c:#0E7490">${simHead(s.simTitle||'🧩 صنّفي البطاقات')}
        <div class="sim-body sort">
          <div class="scard"><span class="scnt"></span><div class="stx"></div></div>
          <div class="bins">${s.bins.map((b,i)=>`<button class="bin" data-b="${i}" style="--c:${b.c}"><div class="bh">${b.i} ${b.t}</div><small>${b.ex}</small><div class="bl"></div></button>`).join('')}</div>
        </div>
        <div class="sim-foot"><span class="msg"></span><button class="btn sm soft rst">🔄</button></div>
      </div></div></div></div>`,
    init:(el,s)=>{
      const card=$('.scard',el), msg=$('.msg',el), bins=$$('.bin',el);
      let order, i, first, score;
      const show=()=>{
        card.style.animation='none'; card.offsetWidth; card.style.animation='';
        if(i>=order.length){
          card.innerHTML=`<div class="stx">🎉 أحسنتِ! صنّفتِ كل البطاقات<br>${score} / ${order.length} من المحاولة الأولى</div>`;
          msg.innerHTML=s.done||''; celebrate(); return; }
        card.innerHTML=`<span class="scnt">${i+1} / ${order.length}</span><div class="stx">${order[i].t}</div>`;
      };
      const start=()=>{ order=shuffle(s.items); i=0; first=true; score=0; $$('.bl',el).forEach(b=>b.innerHTML='');
        msg.innerHTML=s.prompt||'👆 اضغطي على التصنيف المناسب'; show(); };
      bins.forEach(b=>b.onclick=()=>{
        if(i>=order.length) return;
        const it=order[i];
        if(+b.dataset.b===it.b){
          $('.bl',b).insertAdjacentHTML('beforeend',`<div>${it.t}</div>`);
          if(first) score++; Sound.pop(); msg.innerHTML='✅ صحيح!'; i++; first=true; show();
        } else {
          first=false; card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'),500); Sound.wrong();
          msg.innerHTML=s.hint||'🤔 حاولي مرة أخرى';
        }
      });
      $('.rst',el).onclick=start;
      start();
    }
  },

  /* ---------- فيديو: يعمل بالزر وعند انتهائه ننتقل للشريحة التالية ---------- */

    html:s=>`${head(s)}<div class="s-body"><div class="review-grid">
      <div class="story st">
        ${s.steps.map(x=>typeof x==='string'?`<div class="rv">${x}</div>`:`<div class="rv key">${x.t}</div>`).join('')}

        <div class="mb-cap"><div class="en" dir="ltr"></div><div class="ar"></div></div>
        <div class="mb-ctl"><button class="btn sm soft listen">🔊 استمعي</button><button class="btn sm mint tr">🌐 تفعيل الترجمة المباشرة</button><button class="btn sm soft nextLine">الجملة التالية ⬅</button></div>
      </div></div></div></div>`,
    init:(el,s,ctx)=>{
      const mb=$('.meet-big',el), en=$('.en',el), ar=$('.ar',el), trb=$('.tr',el); let i=0, on=false, iv=null, tt=null;
      const typeAr=()=>{ clearInterval(iv); ar.textContent=''; if(!on) return; const t=s.lines[i].ar; let k=0;
        iv=setInterval(()=>{ ar.textContent=t.slice(0,++k); if(k>=t.length) clearInterval(iv); },45); };
      const talk=()=>{ mb.classList.add('talking'); clearTimeout(tt); tt=setTimeout(()=>mb.classList.remove('talking'),3500); };
      const show=()=>{ en.textContent='💬 '+s.lines[i].en; talk(); typeAr(); };
      trb.onclick=()=>{ on=!on; trb.textContent=on?'⏹ إيقاف الترجمة':'🌐 تفعيل الترجمة المباشرة'; if(on){ Sound.success(); typeAr(); } else { clearInterval(iv); ar.textContent=''; } };
      $('.listen',el).onclick=()=>{ say(s.lines[i].en,'en-US'); talk(); };
      $('.nextLine',el).onclick=()=>{ i=(i+1)%s.lines.length; show(); };
      mountReveal(el, $('.nextStep',el), celebrate);
      show();
      ctx.onLeave.push(()=>{ clearInterval(iv); speechSynthesis && speechSynthesis.cancel(); });
    }
  },

  /* ---------- المساعد الشخصي الافتراضي ---------- */
  assistant:{
    html:s=>`${head(s)}<div class="s-body"><div class="asst">
      <div class="col" style="gap:16px">
        <div class="card mid st" style="padding:18px 26px;font-size:29px">${s.def}</div>
        <div class="brands st">${s.brands.map(b=>`<span>${b}</span>`).join('')}</div>
        <div class="more">${s.more.map(m=>`<div class="mbox st" style="--c:${m.c}"><h4>${m.i} ${m.t}</h4><p>${m.d}</p></div>`).join('')}</div>
        <div class="warnbox st">${s.warn}</div>
      </div>
      <div class="phone st"><div class="pscreen">
        <div class="ptop">🎙️ المساعد الذكي <small style="color:var(--muted);font-size:17px">(محاكاة)</small></div>
        <div class="pchat"><div class="bub ai">مرحبًا! كيف أساعدكِ اليوم؟ 😊</div></div>
        <div class="pq">${s.qa.map((x,i)=>`<button data-i="${i}">${x.q}</button>`).join('')}</div>
        <button class="pmic" title="تحدّثي">🎙️</button>
      </div></div></div></div>`,
    init:(el,s,ctx)=>{
      const chat=$('.pchat',el), mic=$('.pmic',el); let busy=false, rec=null;
      const bub=(t,cls)=>{ const b=document.createElement('div'); b.className='bub '+cls; b.textContent=t; chat.appendChild(b); while(chat.children.length>6) chat.firstChild.remove(); return b; };
      const ask=(q,a)=>{ if(busy) return; busy=true; bub(q,'me'); Sound.pop();
        const t=bub('• • •','ai typing');
        setTimeout(()=>{ t.className='bub ai'; t.textContent=a; Sound.pop(); busy=false; },900); };   // رد مكتوب فقط بدون صوت
      $$('.pq button',el).forEach(b=>b.onclick=()=>{ const x=s.qa[+b.dataset.i]; ask(x.q.replace(/^\S+\s/,''), x.a); });
      mic.onclick=()=>{
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR){ toast('الميكروفون يعمل في Chrome — جرّبي الأسئلة الجاهزة 👇',3000); return; }
        if(rec){ rec.stop(); return; }
        rec=new SR(); rec.lang='ar-SA'; let said='';
        rec.onstart=()=>mic.classList.add('on');
        rec.onresult=e=>{ said=[...e.results].map(r=>r[0].transcript).join(''); };
        rec.onerror=()=>toast('تعذّر استخدام الميكروفون — جرّبي الأسئلة الجاهزة 👇',3000);
        rec.onend=()=>{ mic.classList.remove('on'); rec=null; if(said) ask(said, `سمعتُكِ تقولين: «${said}». أنا مساعد تجريبي، جرّبي الأسئلة الجاهزة!`); };
        rec.start();
      };
      ctx.onLeave.push(()=>{ rec&&rec.stop(); });
    }
  },

  /* ---------- الروبوت: التركيب + اختبار العائق ---------- */
  robot:{
    html:s=>`${head(s)}<div class="s-body"><div class="rob">
      <div class="col" style="gap:18px">
        <div class="card st" style="padding:18px 26px;font-size:29px;line-height:1.6">${s.def}</div>

          <div><h4>🔧 ركّبي روبوتًا ذكيًا</h4><div class="comps">${s.parts.map((x,i)=>`<button class="comp" data-i="${i}">${x.i} ${x.t}</button>`).join('')}</div></div>
          <div class="rfig"><div class="rparts"></div><div class="rb">🤖</div><div class="rsay">أحتاج إلى مكوّناتي..</div></div>
        </div>
      </div>
      <div class="lanes st"><h4>🚧 اختبار العائق: ماذا تتوقعين؟</h4>
        <div class="lane arm"><span class="ll">🦾 ذراع المصنع (مهام متكررة)</span><span class="obs">🚧</span><span class="mv">📦</span><span class="boom">💥</span><span class="res">😵 توقّف! لا يعرف كيف يتصرّف</span></div>
        <div class="lane smart"><span class="ll">🤖 روبوت ذكاء اصطناعي</span><span class="obs">🚧</span><span class="flag">🏁</span><span class="mv">🤖</span><span class="res">😎 رأى العائق وغيّر طريقه!</span></div>
        <div class="row" style="justify-content:center;gap:14px"><button class="btn sm mint go">▶ ابدئي الاختبار</button><button class="btn sm soft again">🔄</button></div>
      </div></div></div>`,
    init:(el,s)=>{
      const got=new Set(), fig=$('.rfig',el);
      $$('.comp',el).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(got.has(i)) return; got.add(i); b.classList.add('on'); Sound.pop();
        $('.rparts',fig).textContent=[...got].map(k=>s.parts[k].i).join('');
        if(got.size===s.parts.length){ fig.classList.add('alive'); $('.rsay',fig).textContent=s.alive; celebrate(); say(s.alive); }
        else $('.rsay',fig).textContent=`${got.size} من ${s.parts.length} مكوّنات`; });
      const lanes=$('.lanes',el); let tm=[];
      const reset=()=>{ tm.forEach(clearTimeout); tm=[]; lanes.classList.remove('run'); $$('.res',lanes).forEach(r=>r.classList.remove('show')); };
      $('.go',el).onclick=()=>{ reset(); lanes.offsetWidth; lanes.classList.add('run');
        tm.push(setTimeout(()=>{ $('.arm .res',lanes).classList.add('show'); Sound.wrong(); },1500));
        tm.push(setTimeout(()=>{ $('.smart .res',lanes).classList.add('show'); Sound.success(); },3300)); };
      $('.again',el).onclick=reset;
    }
  },

  /* ---------- الطائرة المسيّرة: صورة بنقاط تفاعلية ---------- */
  drone:{
    html:s=>`${head(s)}<div class="s-body"><div class="dro">
      <div class="col" style="gap:16px">
        <div class="card st" style="padding:18px 26px;font-size:30px;line-height:1.6">${s.def}</div>

  /* ---------- العصف الذهني ---------- */
  brainstorm:{
    html:s=>`${head(s)}<div class="s-body"><div class="bs-grid">
      <div class="col" style="min-height:0">
        <div class="bs-q st">${s.question}</div>
        <div class="bs-input st"><input type="text" placeholder="اكتبي فكرة واضغطي Enter ✍️"><button class="btn add">➕ أضيفي</button><button class="btn soft idea" title="أفكار مقترحة">💡</button></div>
        <div class="bubbles st"><div class="empty">الأفكار ستظهر هنا 💭</div></div>
      </div>
      <div class="col center st">${timerHTML(s.seconds,'⏳ وقت التفكير')}<div class="mid muted" style="text-align:center">لا توجد إجابة خاطئة 💜<br>كل فكرة مرحّب بها</div></div>
    </div></div>`,
    init:(el,s,ctx)=>{
      const inp=$('input',el), box=$('.bubbles',el); let n=0; const ideas=shuffle(s.ideas);

  /* ---------- مختبر تعلّم الآلة ---------- */
  mllab:{
    html:s=>`${head(s)}<div class="s-body"><div class="lab">
      <div class="lab-canvas st"><canvas width="954" height="560"></canvas>
        <div class="axis-x">عدد الروابط في الرسالة 🔗 ←</div>
        <div class="axis-y">كلمات مثل: ربحتِ، مجانًا، جائزة ↑</div></div>
      <div class="col">
        <div class="mode-btns st"><button class="mode spam on" data-m="1">🚫 احتيالية</button><button class="mode ham" data-m="0">✅ سليمة</button><button class="mode test" data-m="t">🔮 اختبري</button></div>
        <div class="lab-info st">1️⃣ اختاري النوع وانقري على اللوحة لتعليم الآلة.<br>2️⃣ اختاري <b>🔮 اختبري</b> وانقري رسالة جديدة!<br>📊 تعلّمت الآلة من <b class="cnt">0</b> مثال.</div>
        <div class="pred st">🤖 علّميني أولًا..</div>
        <div class="lab-tools st"><button class="btn sm soft sample">🎲 أمثلة جاهزة</button><button class="btn sm rose bad">⚠️ بيانات خاطئة</button><button class="btn sm soft clear">🗑️ مسح</button></div>
        <div class="lab-info st" style="font-size:25px;background:var(--amber-l)">💡 لم يكتب أحد القاعدة! الآلة استنتجتها من الأمثلة — مثل مجلد البريد العشوائي (Junk) في Outlook 📧</div>
      </div></div></div>`,
    init:(el,s,ctx)=>{
      const cv=$('canvas',el), g=cv.getContext('2d'), W=cv.width, H=cv.height;
      let pts=[], mode='1', test=null;
      const knn=(x,y)=>{ const k=Math.min(3,pts.length);
        const near=pts.map(p=>({l:p.l,d:(p.x-x)**2+(p.y-y)**2})).sort((a,b)=>a.d-b.d).slice(0,k);
        const spam=near.filter(p=>p.l===1).length; return {l:spam*2>k?1:spam*2<k?0:near[0].l, conf:Math.round(Math.max(spam,k-spam)/k*100)}; };
      const draw=()=>{
        g.clearRect(0,0,W,H);
        if(pts.length){ const c=18; for(let x=0;x<W;x+=c) for(let y=0;y<H;y+=c){ const r=knn((x+c/2)/W,(y+c/2)/H);
          g.fillStyle=r.l?'rgba(244,63,94,.15)':'rgba(16,185,129,.15)'; g.fillRect(x,y,c,c); } }
        g.strokeStyle='rgba(124,58,237,.12)'; g.lineWidth=1;
        for(let x=0;x<=W;x+=W/10){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
        for(let y=0;y<=H;y+=H/8){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
        g.textAlign='center'; g.textBaseline='middle'; g.font='30px sans-serif';
        for(const p of pts){ g.beginPath(); g.arc(p.x*W,p.y*H,20,0,7); g.fillStyle=p.l?'#F43F5E':'#10B981'; g.fill();
          g.lineWidth=4; g.strokeStyle='#fff'; g.stroke(); g.fillStyle='#fff'; g.font='bold 24px sans-serif'; g.fillText(p.l?'✕':'✓',p.x*W,p.y*H+1); }
        if(test){ g.font='54px sans-serif'; g.fillText('✉️',test.x*W,test.y*H); }
        $('.cnt',el).textContent=pts.length;
      };
      const predict=()=>{ if(!test) return; const p=$('.pred',el);
        if(!pts.length){ p.textContent='🤖 لا أعرف! لم تعلّميني أي مثال بعد 😅'; return; }
        const r=knn(test.x,test.y);
        p.innerHTML=r.l?`🤖 أتوقع: <span style="color:var(--rose)">رسالة احتيالية 🚫</span> (${r.conf}%)`:`🤖 أتوقع: <span style="color:#059669">رسالة سليمة ✅</span> (${r.conf}%)`;
        p.style.animation='none'; p.offsetWidth; p.style.animation='pop .4s both'; Sound.pop(); };
      cv.onclick=e=>{ const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
        if(mode==='t'){ test={x,y}; draw(); predict(); } else { pts.push({x,y,l:+mode}); Sound.tick(); draw(); predict(); } };
      $$('.mode',el).forEach(b=>b.onclick=()=>{ $$('.mode',el).forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.m; });
      const rnd=(a,b)=>a+Math.random()*(b-a);
      $('.sample',el).onclick=()=>{ for(let i=0;i<9;i++){ pts.push({x:rnd(.55,.95),y:rnd(.06,.5),l:1}); pts.push({x:rnd(.05,.45),y:rnd(.5,.94),l:0}); } draw(); predict(); Sound.pop(); };
      $('.bad',el).onclick=()=>{ for(let i=0;i<7;i++) pts.push({x:rnd(.6,.9),y:rnd(.1,.4),l:0}); draw(); predict(); Sound.wrong();
        toast('⚠️ بيانات خاطئة = نتائج خاطئة! تخيّلي ذلك في التشخيص الطبي 🩺', 3500); };
      $('.clear',el).onclick=()=>{ pts=[]; test=null; draw(); $('.pred',el).textContent='🤖 علّميني أولًا..'; };
      draw();
    }
  },

        btns.forEach((b,k)=>{ b.classList.toggle('cur',k===cur); b.classList.toggle('done',k<cur); });

        $('.mprev',el).disabled=cur===0;

      btns.forEach(b=>b.onclick=()=>go(+b.dataset.i));
      $('.mprev',el).onclick=()=>go(cur-1);

    init:(el,s)=>{

        slots[i].innerHTML=`<span class="n">${i+1}</span><span class="si">${st.i}</span><span class="sn">${st.t}</span><span class="sa">${st.a}</span>`; };
      const reset=()=>{ next=0; pool.innerHTML=shuffle(s.steps.map((x,idx)=>({...x,idx}))).map(x=>`<button class="chipbtn" data-i="${x.idx}">${x.i} ${x.t}</button>`).join('');
        slots.forEach((sl,i)=>{ sl.classList.remove('fill'); sl.innerHTML=`<span class="n">${i+1}</span><span class="muted" style="font-size:44px">؟</span>`; });
        $$('.chipbtn',pool).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i;
          if(i===next){ b.classList.add('used'); place(i); next++; Sound.pop();
            if(next===s.steps.length){ celebrate(); toast(s.doneToast||'🏆 رائع! أكملتِ الترتيب'); } }

      $('.again',el).onclick=reset;
      $('.sol',el).onclick=()=>{ s.steps.forEach((_,i)=>place(i)); $$('.chipbtn',pool).forEach(b=>b.classList.add('used')); next=s.steps.length; };
      reset();
    }
  },

  speech:{

        <div class="row st" style="justify-content:center;flex-wrap:wrap;gap:16px">

        <div style="margin-top:auto"><button class="btn amber rvb">اكشفي المعاني ⬅</button></div></div>
    </div></div>`,
    init:(el,s,ctx)=>{
      const out=$('.sr-text',el), wrap=$('.sr',el); let rec=null;
      const set=t=>{ out.textContent=t; };
      const sim=()=>{ wrap.classList.add('listening'); set('...'); let i=0;
        setTimeout(()=>{ const iv=setInterval(()=>{ set(s.sample.slice(0,++i)); if(i>=s.sample.length){ clearInterval(iv); wrap.classList.remove('listening'); Sound.success(); } },140); },1300); };
      $('.sim',el).onclick=sim;
      $('.speak',el).onclick=()=>say(out.textContent.replace(/[🎙️«»]/g,''));
      $('.mic',el).onclick=()=>{
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR){ toast('المتصفح لا يدعم التعرّف على الكلام — استخدمي Chrome أو زر «محاكاة»',3500); return; }
        if(rec){ rec.stop(); return; }
        rec=new SR(); rec.lang='ar-SA'; rec.interimResults=true;
        rec.onstart=()=>{ wrap.classList.add('listening'); set('👂 أستمع إليكِ...'); };
        rec.onresult=e=>set([...e.results].map(r=>r[0].transcript).join(''));
        rec.onerror=e=>toast('تعذّر استخدام الميكروفون ('+e.error+') — جرّبي زر «محاكاة»',3500);
        rec.onend=()=>{ wrap.classList.remove('listening'); rec=null; };
        rec.start();
      };
      ctx.onLeave.push(()=>{ rec&&rec.stop(); });
      mountReveal($('.ayn',el), $('.rvb',el));
    }
  },

    </div></div>`,
    init:(el,s,ctx)=>{
      let cur=0; const res=s.items.map(()=>null);
      const show=()=>{ const it=s.items[cur];
        $('.tn',el).textContent=`العبارة ${cur+1} من ${s.items.length}`; $('.tt',el).innerHTML=it.t;
        const c=$('.tf-card',el); c.style.animation='none'; c.offsetWidth; c.style.animation='rise .45s both';
        $('.fb',el).innerHTML=res[cur]===true?'<span class="good">أحسنتِ! 👏 إجابة صحيحة</span>'+(it.fix?`<small>💡 ${it.fix}</small>`:''):'';
        $$('.dots i',el).forEach((d,i)=>{ d.className=(i===cur?'cur ':'')+(res[i]===true?'r':res[i]===false?'w':''); }); };
      const answer=v=>{ const it=s.items[cur]; if(res[cur]===true) return;
        if(v===it.a){ res[cur]=true; celebrate(); } else { res[cur]=false; Sound.wrong(); $('.tf-card',el).classList.add('shake'); setTimeout(()=>$('.tf-card',el).classList.remove('shake'),500); }
        show(); if(v!==it.a) $('.fb',el).innerHTML='<span class="bad">حاولي مرة أخرى 💜</span>';
        if(res.every(r=>r===true)) setTimeout(()=>{ clap(); toast('🏆 أنهيتِ جميع العبارات بنجاح!'); },700); };
      $('.yes',el).onclick=()=>answer(true); $('.no',el).onclick=()=>answer(false);
      $('.nextQ',el).onclick=()=>{ cur=(cur+1)%s.items.length; show(); };
      $('.prevQ',el).onclick=()=>{ cur=(cur-1+s.items.length)%s.items.length; show(); };
      $$('.dots i',el).forEach(d=>d.onclick=()=>{ cur=+d.dataset.i; show(); });
      ctx.keys=k=>{ if(k==='1'||k==='١'){answer(true);return true} if(k==='2'||k==='٢'){answer(false);return true} };
      show();
    }
  },

    init:(el,s,ctx)=>{

      const item=$('.ch-item',el), btns=$('.ch-btns',el), start=$('.startC',el), fb=$('.fb',el);
      const end=msg=>{ clearInterval(iv); on=false; btns.style.display='none'; start.style.display=''; start.textContent='🔄 العبي مرة أخرى';
        item.innerHTML=`${msg}<br>نتيجتكِ: ${pts} من ${items.length} ${pts>=items.length*.7?'🏆':'💪'}`; fb.innerHTML='';
        if(pts>=items.length*.7){ celebrate(); clap(); } else Sound.bell(); };
      const showItem=()=>{ item.textContent=items[idx].t; item.style.animation='none'; item.offsetWidth; item.style.animation='rise .35s both'; };
      const tick=()=>{ left--; $('.tl',el).textContent=left; $('.bar i',el).style.width=(left/s.seconds*100)+'%'; if(left<=5&&left>0) Sound.tick(); if(left<=0) end('⏰ انتهى الوقت!'); };
      const answer=ai=>{ if(!on) return; const exp=items[idx].a??items[idx].ai, ok=exp===ai;
        if(ok){ pts++; Sound.success(); fb.innerHTML='<span class="good">✔️ صحيح!</span>'; } else { Sound.wrong(); fb.innerHTML=`<span class="bad">✖️ الإجابة: ${(s.labels||CH_LABELS)[exp?0:1]}</span>`; }
        $('.pts',el).textContent=pts; idx++; if(idx>=items.length) end('🎉 أنهيتِ كل البطاقات!'); else showItem(); };
      start.onclick=()=>{ items=shuffle(s.items); idx=0; pts=0; left=s.seconds; on=true; $('.pts',el).textContent=0; $('.tl',el).textContent=left; $('.bar i',el).style.width='100%';
        start.style.display='none'; btns.style.display=''; fb.innerHTML=''; showItem(); clearInterval(iv); iv=setInterval(tick,1000); };
      $('.ai',el).onclick=()=>answer(true); $('.norm',el).onclick=()=>answer(false);
      ctx.keys=k=>{ if(!on) return; if(k==='1'||k==='١'){answer(true);return true} if(k==='2'||k==='٢'){answer(false);return true} };
      ctx.onLeave.push(()=>{ if(on){ clearInterval(iv); on=false; btns.style.display='none'; start.style.display=''; start.textContent='🚀 ابدئي التحدي'; item.textContent='جاهزات؟ ⏱️'; } });

  /* ---------- الحوسبة السحابية: المزامنة بين الأجهزة ---------- */
  cloud:{
    html:s=>`${head(s)}<div class="s-body"><div class="duo">
      <div class="col" style="gap:16px">
        <div class="card st" style="padding:16px 24px"><h4 class="ctl">✨ لماذا أصبحت السحابة خيارًا شائعًا للأشخاص والشركات؟</h4><div class="perks">${s.perks.map(p=>`<span>${p}</span>`).join('')}</div></div>

        <div class="fact st">${s.fact}</div>
      </div>
      <div class="st"><div class="sim" style="--c:#4F46E5">${simHead('☁️ محاكاة: المزامنة السحابية')}
        <div class="sim-body"><div class="csim">
          <svg class="clines" viewBox="0 0 100 100" preserveAspectRatio="none">${CLOUD_DEV.map(d=>`<line x1="50" y1="24" x2="${d.x}" y2="70"/>`).join('')}</svg>
          <div class="cl-cloud"><span class="ce">☁️</span><b>السحابة</b><small class="cc">0 صورة</small></div>
          ${CLOUD_DEV.map(d=>`<div class="cdev" data-k="${d.k}" style="left:${d.x}%"><span class="de">${d.i}</span><b>${d.t}</b><div class="files"></div><span class="pend"></span></div>`).join('')}
        </div></div>
        <div class="sim-foot"><span class="msg">👆 التقطي صورة بالجوال وراقبي ماذا يحدث</span>
          <button class="btn sm snap">📸 التقطي صورة</button><button class="btn sm mint net">📶 متصل</button><button class="btn sm soft rst">🔄</button></div>
      </div></div></div></div>`,
    init:(el,s,ctx)=>{
      const box=$('.csim',el), msg=$('.msg',el), net=$('.net',el), pics=['🏞️','🐪','🌴','🕌','🌅','🎓','🏜️','🌙'];
      let online=true, n=0, cloudN=0, pend=[], tm=[];
      const later=(ms,fn)=>tm.push(setTimeout(fn,ms));
      const dev=k=>$(`.cdev[data-k="${k}"]`,box);
      const ping=x=>{ x.classList.remove('ping'); x.offsetWidth; x.classList.add('ping'); };
      const add=(k,e)=>{ const f=$('.files',dev(k)); f.insertAdjacentHTML('afterbegin',`<i>${e}</i>`); while(f.children.length>4) f.lastChild.remove(); ping(dev(k)); };
      const fly=(e,x1,y1,x2,y2)=>{ const f=document.createElement('span'); f.className='flyer'; f.textContent=e;
        f.style.left=x1+'%'; f.style.top=y1+'%'; box.appendChild(f); f.offsetWidth; f.style.left=x2+'%'; f.style.top=y2+'%'; later(800,()=>f.remove()); };
      const setPend=()=>{ $('.pend',dev('phone')).textContent=pend.length?`⏳ ${pend.length} بانتظار الاتصال`:''; };
      const others=CLOUD_DEV.filter(d=>d.k!=='phone');
      const sync=e=>{ fly(e,50,70,50,24);
        later(750,()=>{ cloudN++; $('.cc',box).textContent=`${cloudN} صورة`; ping($('.cl-cloud',box)); Sound.pop(); others.forEach(d=>fly(e,50,24,d.x,70)); });
        later(1550,()=>{ others.forEach(d=>add(d.k,e)); Sound.success(); msg.innerHTML='✅ تمت المزامنة! الصورة نفسها على <b>كل أجهزتكِ</b>'; }); };
      $('.snap',el).onclick=()=>{ const e=pics[n++%pics.length]; add('phone',e); Sound.tick();
        if(online){ msg.textContent='⬆️ ترتفع الصورة إلى السحابة عبر الإنترنت...'; sync(e); }
        else { pend.push(e); setPend(); msg.innerHTML='📴 لا يوجد اتصال.. الصورة محفوظة في الجوال، وستُرفع <b>تلقائيًا</b> عند عودة الإنترنت'; } };
      const toggleNet=()=>{ online=!online; box.classList.toggle('off',!online);
        net.textContent=online?'📶 متصل':'📴 غير متصل'; net.classList.toggle('mint',online); net.classList.toggle('rose',!online);
        if(online && pend.length){ msg.textContent='📶 عاد الاتصال.. جارٍ رفع الصور المنتظرة تلقائيًا'; pend.forEach((e,i)=>later(i*1700,()=>sync(e))); pend=[]; setPend(); }
        else if(!online) msg.textContent='📴 قطعتِ الإنترنت.. جرّبي التقاط صورة الآن';
        else msg.textContent='📶 عاد الاتصال'; };
      net.onclick=toggleNet;
      $('.rst',el).onclick=()=>{ tm.forEach(clearTimeout); tm=[]; $$('.files',box).forEach(f=>f.innerHTML=''); $$('.flyer',box).forEach(f=>f.remove());
        cloudN=0; pend=[]; setPend(); $('.cc',box).textContent='0 صورة'; if(!online) toggleNet(); msg.textContent='👆 التقطي صورة بالجوال وراقبي ماذا يحدث'; };
      ctx.onLeave.push(()=>{ tm.forEach(clearTimeout); tm=[]; $$('.flyer',box).forEach(f=>f.remove()); });
    }
  },

  /* ---------- المخاطر الأمنية + محاكاة المصادقة الثنائية ---------- */
  twofa:{
    html:s=>`${head(s)}<div class="s-body"><div class="duo">
      <div class="col" style="gap:14px">
        ${s.risks.map(r=>`<div class="risk peek st"><h4>${r.i} ${r.t}</h4><div class="peek-q">👆 ما الخطر؟</div><div class="peek-a">${r.d}</div></div>`).join('')}

              <div class="fld"><small>كلمة المرور</small><span>●●●●●●●● <em class="stolen">🕵️ سرقها المتسلل!</em></span></div>
              <div class="code"><small>📲 رمز التحقق</small><div class="digits"><i></i><i></i><i></i><i></i></div></div>
            </div>

          </div>
          <div class="tfa-res">👇 اختاري من سيحاول الدخول</div>
        </div></div>
        <div class="sim-foot" style="justify-content:center"><button class="btn sm rose hack">🕵️ المتسلل يحاول الدخول</button><button class="btn sm mint own">👩 صاحبة الحساب تدخل</button></div>
      </div></div></div></div>`,
    init:(el,s,ctx)=>{
      let on=false, busy=false, tm=[];
      const box=$('.tfa',el), res=$('.tfa-res',el), sms=$('.sms',el), dg=$$('.digits i',el);
      const later=(ms,fn)=>tm.push(setTimeout(fn,ms));
      const result=(h,cls='')=>{ res.className='tfa-res '+cls; res.innerHTML=h; };
      const clear=()=>{ dg.forEach(d=>{ d.textContent=''; d.className=''; }); sms.textContent='لا توجد رسائل'; sms.classList.remove('new'); };
      const rnd4=()=>String(1000+Math.random()*9000|0);
      $('.tsw',el).onclick=()=>{ if(busy) return; on=!on; box.classList.toggle('on',on); $('.tsw em',el).textContent=on?'مفعّلة ✅':'معطّلة ⛔'; clear(); Sound.pop();
        result(on?'🔐 الآن يحتاج الدخول إلى <b>كلمة المرور + رمز يصل إلى الجوال</b>':'⚠️ الدخول الآن بكلمة المرور فقط'); };
      const attempt=hacker=>{ if(busy) return; busy=true; clear(); result('⏳ جارٍ تسجيل الدخول...');
        if(!on){ later(900,()=>{ busy=false;
            if(hacker){ result('🔓 دخل المتسلل بكلمة المرور المسروقة.. ووصل إلى ملفاتكِ! 😱','bad'); Sound.wrong(); box.classList.add('shake'); later(500,()=>box.classList.remove('shake')); }
            else result('✅ دخلتِ.. لكن انتبهي: أي شخص يعرف كلمة المرور يستطيع الدخول مثلكِ!','warn'); }); return; }
        const code=rnd4(); let typed=code; if(hacker) while(typed===code) typed=rnd4();
        later(700,()=>{ sms.innerHTML=`💬 رمز التحقق: <b class="ltr">${code}</b><br><small>لا تشاركيه مع أحد</small>`; sms.classList.add('new'); Sound.pop();
          result(hacker?'📲 أُرسل الرمز إلى <b>جوال صاحبة الحساب</b>.. والمتسلل لا يملكه! 🤔':'📲 وصل الرمز إلى جوالكِ.. تُدخلينه الآن'); });
        [...typed].forEach((c,i)=>later(1500+i*350,()=>{ dg[i].textContent=c; Sound.tick(); }));
        later(3200,()=>{ busy=false;
          if(hacker){ dg.forEach(d=>d.className='w'); result('⛔ رمز خاطئ! تم <b>منع الدخول</b>.. المصادقة الثنائية حمت الحساب 🛡️','good'); celebrate(); }
          else { dg.forEach(d=>d.className='r'); result('✅ رمز صحيح من جوالكِ.. تم الدخول <b>بأمان</b> 🔐','good'); Sound.success(); } });
      };
      $('.hack',el).onclick=()=>attempt(true); $('.own',el).onclick=()=>attempt(false);
      ctx.onLeave.push(()=>{ tm.forEach(clearTimeout); tm=[]; busy=false; });
    }
  },

          ${s.nets.map((n,i)=>`<div class="lane2" style="--c:${n.c}"><div class="lh"><b class="ltr">${n.k}</b><span>${n.mbps>=1000?n.mbps/1000+' جيجابت/ث':n.mbps+' ميجابت/ث'}</span><em class="tt">—</em></div><div class="bar2"><i></i><span class="pc">0%</span></div></div>`).join('')}

      </div></div></div></div>`,
    init:(el,s,ctx)=>{
      let f=0, raf=null; const msg=$('.msg',el), lanes=$$('.lane2',el);
      const fmt=t=>{ if(t<1) return t.toFixed(2)+' ثانية'; if(t<60) return (Math.round(t*10)/10)+' ثانية';
        const m=Math.floor(t/60), sec=Math.round(t%60); if(m<60) return `${m} دقيقة${sec?` و${sec} ثانية`:''}`; return `${Math.floor(m/60)} ساعة و${m%60} دقيقة`; };
      const times=()=>s.nets.map(n=>s.files[f].gb*8000/n.mbps);
      const math=()=>{ const F=s.files[f]; $('.mt',el).innerHTML=`${F.l} = <b class="ltr">${(F.gb*8000).toLocaleString('en-US')}</b> ميجابت (لأن البايت = 8 بت)`; };
      const reset=()=>{ cancelAnimationFrame(raf); lanes.forEach(l=>{ $('i',l).style.width='0%'; $('.pc',l).textContent='0%'; $('.tt',l).textContent='—'; l.classList.remove('win'); }); };
      $$('.np',el).forEach(b=>b.onclick=()=>{ $$('.np',el).forEach(x=>x.classList.remove('on')); b.classList.add('on'); f=+b.dataset.i; reset(); math(); Sound.pop(); });
      $('.go',el).onclick=()=>{ reset(); const T=times(), slow=Math.max(...T), t0=performance.now(), done=T.map(()=>false);
        const step=now=>{ lanes.forEach((l,i)=>{ const p=Math.min(1,(now-t0)/Math.max(150, 6000*T[i]/slow));
            $('i',l).style.width=(p*100)+'%'; $('.pc',l).textContent=Math.round(p*100)+'%'; $('.tt',l).textContent=fmt(T[i]*p);
            if(p>=1 && !done[i]){ done[i]=true; $('.tt',l).textContent='✅ '+fmt(T[i]); if(T[i]===Math.min(...T)){ l.classList.add('win'); Sound.success(); } else Sound.pop(); } });
          if(done.every(Boolean)){ msg.innerHTML=`🚀 الجيل الخامس أسرع من الرابع بـ <b>${Math.round(slow/Math.min(...T))} مرة</b>! (20,000 ÷ 100)`; FX.confetti(); return; }
          raf=requestAnimationFrame(step); };
        msg.textContent='⏳ بدأ السباق.. الزمن الحقيقي يظهر بجانب كل شبكة'; raf=requestAnimationFrame(step); };
      math(); ctx.onLeave.push(()=>cancelAnimationFrame(raf));
    }
  },

    init:(el,s)=>{
      const bit=$('.qcol.bit',el), qb=$('.qcol.qb',el); let b=1, ph=0, run=true, last=0;

      $$('.np',el).forEach(b=>b.onclick=()=>{ pick(+b.dataset.i); Sound.pop(); msg.textContent='👆 اضغطي «ابدئي الطباعة»'; });
      go.onclick=()=>{ pick(k); go.disabled=true; noz.classList.add('run'); const K=s.kinds[k], N=K.shape.length;
        msg.textContent='🖨️ تضع الطابعة المادة طبقة فوق طبقة...';
        K.shape.forEach((w,i)=>tm.push(setTimeout(()=>{ const d=document.createElement('i'); d.style.width=w+'%'; d.style.height=(100/N)+'%'; lay.appendChild(d);
          noz.style.bottom=`calc(6% + 14px + ${(i+1)/N*64}%)`; Sound.tick(); }, 300+i*320)));
        tm.push(setTimeout(()=>{ noz.classList.remove('run'); done.innerHTML=`${K.e}<small>${K.name}</small>`; done.classList.add('show'); go.disabled=false;
          msg.innerHTML=`✅ تمت طباعة <b>${K.name}</b> من نموذج أولي رقمي، دون إهدار للمواد!`; celebrate(); }, 600+N*320));
      };
      pick(0); ctx.onLeave.push(stop);
    }
  }
};

/* ==========================================================================
   🎬 محرك التنقل بين الشرائح
   ========================================================================== */
const Deck = {
  els:[], ctx:[], cur:-1,
  build(){
    const root=$('#slides');
    SLIDES.forEach((s,i)=>{
      const t=T[s.type] || { html:()=>`<h2 class="s-title">⚠️ نوع شريحة غير معروف: ${esc(s.type)}</h2>` };
      const el=document.createElement('section'); el.className='slide'; el.dataset.anim=s.anim||'fade';
      el.innerHTML=t.html(s);
      $$('.st',el).forEach((x,k)=>x.style.setProperty('--d',k));
      root.appendChild(el);
      const ctx={onLeave:[], keys:null, s};
      // عناصر «اضغطي لتظهر» العامة
      $$('.peek',el).forEach(p=>{ p.tabIndex=0; const f=()=>{ p.classList.toggle('open'); Sound.pop(); }; p.addEventListener('click',f); p.addEventListener('keydown',e=>{ if(e.key==='Enter') f(); }); });
      t.init && t.init(el, s, ctx);
      if(s.audio){ const au=new Audio(s.audio); au.preload='auto'; ctx.audio=au;
        ctx.onLeave.push(()=>{ au.pause(); au.currentTime=0; }); }
      this.els.push(el); this.ctx.push(ctx);
    });
    const start=parseInt(location.hash.slice(1),10);
    this.go(isNaN(start)?0:start-1, true);
  },
  go(n, first=false){
    n=Math.max(0, Math.min(this.els.length-1, n));
    if(n===this.cur) return;
    const fwd=n>this.cur, old=this.els[this.cur], nu=this.els[n];
    if(old){ this.ctx[this.cur].onLeave.forEach(f=>f()); old.classList.remove('active','enter-fade','enter-zoom','enter-slide','fwd','back');
      old.classList.add('leaving'); setTimeout(()=>old.classList.remove('leaving'),460); }
    if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
    nu.classList.remove('leaving'); nu.classList.add('active', 'enter-'+nu.dataset.anim, fwd?'fwd':'back');
    this.cur=n;
    const au=this.ctx[n].audio;
    if(au){ au.currentTime=0; au.play().catch(()=>{   // المتصفح يمنع التشغيل قبل أول تفاعل
      toast('🔊 اضغطي في أي مكان لتشغيل الصوت',3000);
      addEventListener('pointerdown',()=>{ if(this.cur===n) au.play().catch(()=>{}); },{once:true}); }); }
    $('#counter').textContent=`${n+1} / ${this.els.length}`;
    $('#progress').style.width=((n+1)/this.els.length*100)+'%';
    history.replaceState(null,'','#'+(n+1));
    $('#btnPrev').disabled = n===0; $('#btnNext').disabled = n===this.els.length-1;
    this.renderNotes();
  },
  next(){ this.go(this.cur+1); },
  prev(){ this.go(this.cur-1); },
  renderNotes(){ const s=SLIDES[this.cur]; $('#notes').innerHTML=`<h4>📝 ملاحظات للمعلمة — الشريحة ${this.cur+1}</h4>${s.notes||'لا توجد ملاحظات لهذه الشريحة.'}`; }
};

/* ---------- تكبير المسرح ليملأ الشاشة بنسبة 16:9 ---------- */
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); $('#stage').style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

/* ---------- فيديو الترحيب: يُفتح في نافذة وعند انتهائه ننتقل للشريحة التالية ---------- */
function playWelcomeVideo(){
  let m=$('#vidModal');
  if(!m){
    m=document.createElement('div'); m.id='vidModal';
    m.innerHTML='<div class="vbox"><button class="vclose" title="إغلاق (Esc)">✕</button><video src="'+esc(LESSON.welcomeVideo)+'" playsinline controls></video></div>';
    document.body.appendChild(m);
    const v=$('video',m);
    $('.vclose',m).onclick=()=>closeWelcomeVideo();
    m.onclick=e=>{ if(e.target===m) closeWelcomeVideo(); };
    v.onended=()=>{ closeWelcomeVideo(); Deck.next(); };
  }
  const v=$('video',m); v.currentTime=0; m.classList.add('show');
  v.play().catch(()=>{});
}
function closeWelcomeVideo(){ const m=$('#vidModal'); if(!m) return; $('video',m).pause(); m.classList.remove('show'); }

/* ---------- لوحة المفاتيح ---------- */
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(typing){ if(e.key==='Escape') e.target.blur(); return; }   // لا نتدخل أثناء الكتابة
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const vm=$('#vidModal');
  if(vm && vm.classList.contains('show')){   // أثناء عرض الفيديو: لا تنقّل بين الشرائح
    if(e.key==='Escape') closeWelcomeVideo();
    else if(e.key===' '){ e.preventDefault(); const v=$('video',vm); v.paused?v.play():v.pause(); }
    return;
  }
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); Deck.next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); Deck.prev(); }
  else if(k==='ArrowUp'||k==='ArrowDown'){ e.preventDefault(); }
  else if(k==='Home'){ e.preventDefault(); Deck.go(0); }
  else if(k==='End'){ e.preventDefault(); Deck.go(Deck.els.length-1); }
  else if(k==='ت'||e.code==='KeyJ'){ e.preventDefault(); clap(); }
  else if(e.code==='KeyF'){ toggleFull(); }
  else if(e.code==='KeyN'){ $('#notes').classList.toggle('show'); }
  else { const c=Deck.ctx[Deck.cur]; if(c && c.keys && c.keys(k)) e.preventDefault(); }
});

/* ---------- الأزرار ---------- */
$('#btnNext').onclick=()=>Deck.next();
$('#btnPrev').onclick=()=>Deck.prev();
$('#btnClap').onclick=()=>clap();
$('#btnNotes').onclick=()=>$('#notes').classList.toggle('show');
$('#btnFull').onclick=()=>toggleFull();
function toggleFull(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); }
// منع زر المسافة من «ضغط» آخر زر تم النقر عليه
document.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) setTimeout(()=>b.blur(),0); });

/* ---------- إخفاء شريط التحكم تلقائيًا عند عدم تحريك الماوس ---------- */
let idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT=setTimeout(()=>{ if(!$('#controls').matches(':hover')) document.body.classList.add('idle'); }, 2800); }
['mousemove','mousedown','touchstart','keydown'].forEach(ev=>addEventListener(ev, wake, {passive:true}));
wake();

/* منع التمرير بالعجلة أو اللمس */
addEventListener('wheel', e=>{ if(!e.target.closest('textarea,.code-out,#notes')) e.preventDefault(); }, {passive:false});

/* تحميل الأصوات للنطق مبكرًا */
if('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- 🧠 خلفية «شبكة عصبية» تتحرك بهدوء خلف الشرائح ---------- */
(function neuralBackground(){
  const cv=document.createElement('canvas'); cv.id='neural'; cv.width=1920; cv.height=1080;
  $('#stage').insertBefore(cv, $('#slides'));
  const g=cv.getContext('2d'), N=46, LINK=230;
  const pts=Array.from({length:N},()=>({x:Math.random()*1920, y:Math.random()*1080, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:1.5+Math.random()*2.5}));
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches; let last=0;
  function frame(t){
    if(!still) requestAnimationFrame(frame);
    if(t-last<33) return; last=t;                       // نحو 30 إطارًا في الثانية لتخفيف الحمل
    g.clearRect(0,0,1920,1080);
    for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>1920) p.vx*=-1; if(p.y<0||p.y>1080) p.vy*=-1; }
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){ const a=pts[i], b=pts[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<LINK){ g.strokeStyle=`rgba(103,232,249,${(1-d/LINK)*.35})`; g.lineWidth=1; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }
    for(const p of pts){ g.fillStyle='rgba(167,139,250,.9)'; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); }
  }
  requestAnimationFrame(frame);
})();

Deck.build();
</script>
